[package]
name = "covopt-macro"
version = "3.0.0"
edition = "2024"
description = "Source annotations and explicit parameter-search adapters for CovOpt"
license = "MIT"
repository = "https://github.com/hianova/CovOpt-Analyzer"
homepage = "https://github.com/hianova/CovOpt-Analyzer"
documentation = "https://docs.rs/covopt-macro"
readme = "README.md"
keywords = ["performance", "macro", "tuning", "optimization", "complexity"]
categories = ["development-tools::profiling", "no-std"]
authors = ["hianova <hianova@github.com>"]
exclude = [
    ".DS_Store",
    ".agents/",
    ".covopt/",
    ".covopt.toml",
    ".covopt_backup/",
    "scratch/",
]

[lib]
proc-macro = true

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
covopt-schema = { path = "../covopt-schema", version = "3.0.0" }
syn = { version = "3.0", features = ["full", "parsing", "visit"] }
quote = "1.0"
proc-macro2 = "1.0"

[features]
default = ["std"]
std = []

[dev-dependencies]
trybuild = "1.0"
